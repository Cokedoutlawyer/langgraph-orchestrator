[project]
name = "langgraph-orchestrator"
version = "0.2.0"
description = "LangGraph orchestrator with BrightData/Oxylabs/Venice tool wrappers, Camofox browser backend, and multi-agent auto-build pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-brightdata>=0.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "weaviate-engram>=1.0.0",
    "weaviate-agents>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.13.0"]
auto-build = ["httpx>=0.27.0", "pydantic>=2.9.0", "tenacity>=9.0.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_orchestrator", "src/hermes_github", "src/auto_build", "src/pipeline_schemas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]
